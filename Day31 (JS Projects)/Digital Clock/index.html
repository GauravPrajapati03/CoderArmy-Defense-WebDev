<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: hidden;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            border: 1px solid rgb(122, 209, 246);
            padding: 20px 30px;
            border-top-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        #time{
            font-size: 6rem;

        }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
    <h2 id="time"></h2>
    
    <script src="./script.js"></script>
</body>
</html>
