<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bg Color Changer</title>
    <style>
        button{
            font-size: 1.2rem;
            border: none;
            margin-right: 5px;
            border-radius: 5px;
            border: 1px solid white;
            padding: 5px 10px;
        }
    </style>
</head>
<body style="background-color: black; color: white;">

    <div id="container">
        <button id="red" style="background-color: red;">Red</button>
        <button id="blue" style="background-color: blue;">Blue</button>
        <button id="green" style="background-color: green;">Green</button>
        <button id="yellow" style="background-color: yellow;">Yellow</button>
        <button id="orange" style="background-color: orange;">Orange</button>
        <button id="pink" style="background-color: pink;">Pink</button>
        <button id="coral" style="background-color: coral;">Coral</button>
        <button id="violet" style="background-color: violet ;">Violet</button>
    </div>
    
    <script src="./script.js"></script>

</body>
</html>
